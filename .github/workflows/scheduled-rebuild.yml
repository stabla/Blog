name: Scheduled Rebuild

on:
  schedule:
    # Rebuild daily at 08:00 UTC so future-dated posts go live on their date
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Push empty commit to trigger Pages rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Scheduled rebuild $(date -u +%Y-%m-%d)"
          git push
